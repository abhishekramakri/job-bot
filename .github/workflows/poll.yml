      - name: Run poller
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_ERIKA }}
        run: python poller.py erika

      - name: Commit updated seen.json
        env:
          SEEN_PATH: profiles/erika/seen.json
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"

