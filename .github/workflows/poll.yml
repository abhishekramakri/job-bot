            python3 merge_seen.py /tmp/run_seen.json "$SEEN_PATH"

            git add "$SEEN_PATH"
            if git diff --quiet --cached; then
              echo "no changes to commit"
              pushed=true
              break
            fi
            git commit -m "update seen jobs (erika)"

            if git push origin HEAD:main; then
              echo "pushed successfully"
              pushed=true
              break
            fi
            echo "push rejected, retrying with fresh merge (attempt $attempt)"
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push seen.json after 5 attempts"
            exit 1
          fi

  poll-aparna:
