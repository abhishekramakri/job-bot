              pushed=true
              break
            fi
            git commit -m "update seen jobs (aparna)"

            if git push origin HEAD:main; then
              echo "pushed successfully"
              pushed=true
              break
            fi
            echo "push rejected, retrying with fresh merge (attempt $attempt)"
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push seen.json after 5 attempts"
            exit 1
          fi

  poll-keya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
