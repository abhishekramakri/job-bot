            if git diff --quiet --cached; then
              echo "no changes to commit"
              pushed=true
              break
            fi
            git commit -m "update seen jobs (keya)"

            if git push origin HEAD:main; then
              echo "pushed successfully"
              pushed=true
              break
            fi
            echo "push rejected, retrying with fresh merge (attempt $attempt)"
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::failed to push seen.json after 5 attempts"
            exit 1
          fi

  # Starts the once-a-day list picks (lists.yml) during the 5 pm Pacific hour.
  # GitHub's own schedule skips most runs for this repo, so it rides on this
  # workflow's hourly cron-job.org trigger instead.
  start-list-picks:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start list picks at 5 pm Pacific
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.start_list_picks }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$(TZ=America/Los_Angeles date +%H)" = "17" ]; then
            gh workflow run lists.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "not the 5 pm Pacific hour; nothing to start"
          fi
